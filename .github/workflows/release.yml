name: release

# Push a tag like v0.1.0 to build and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: ver
        shell: pwsh
        run: echo "version=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish (small, needs .NET 10 Desktop Runtime)
        run: dotnet publish src/OpenPin/OpenPin.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -p:Version=${{ steps.ver.outputs.version }} -o out/fd

      - name: Publish (self-contained, single file)
        run: dotnet publish src/OpenPin/OpenPin.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o out/sc

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path out/fd/* -DestinationPath OpenPin-${{ steps.ver.outputs.version }}-win-x64.zip
          Compress-Archive -Path out/sc/* -DestinationPath OpenPin-${{ steps.ver.outputs.version }}-win-x64-selfcontained.zip

      # MSIX (self-contained). Configure in the repo settings:
      #   variables: MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME (from Partner Center → Product identity)
      #   secrets (optional, for a sideload-installable signed package): MSIX_CERT_BASE64 (.pfx as base64), MSIX_CERT_PASSWORD
      - name: MSIX
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.MSIX_CERT_BASE64 }}
          CERT_PWD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $opts = @{
            Version = '${{ steps.ver.outputs.version }}'
            OutDir = "$PWD"
            IdentityName = '${{ vars.MSIX_IDENTITY_NAME }}'
            Publisher = '${{ vars.MSIX_PUBLISHER }}'
            PublisherDisplayName = '${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}'
          }
          if (-not $opts.IdentityName) { $opts.IdentityName = 'OpenPin' }
          if (-not $opts.Publisher) { $opts.Publisher = 'CN=OpenPin' }
          if (-not $opts.PublisherDisplayName) { $opts.PublisherDisplayName = 'OpenPin contributors' }
          if ($env:CERT_B64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT_B64))
            $opts.CertPath = "$env:RUNNER_TEMP\cert.pfx"
            $opts.CertPassword = $env:CERT_PWD
          }
          ./packaging/msix/build-msix.ps1 @opts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            OpenPin-*.zip
            OpenPin-*.msix
